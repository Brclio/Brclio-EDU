<div class = "container">
  <div class = "container2">
  <div style="float:left;margin-right:10px;">
   <label class ="lab">ASCII code:</label>
  <input id="userInput1" type="number" class = "inp1">
  </div>
   <div style="float:left;margin-right:10px;">
      <label class = "lab">character</label>
      <input id="chara" type="text" class = "inp">
    </div>
    <div style="float:left;margin-right:10px;">
      <label class = "lab">binary equivalent</label>
      <input id="bin" type="text" class = "inp">
    </div>
  </div>
  <button class = "done-btn">Done</button> 
</div>
<script type="text/javascript">
const input1 = document.getElementById("userInput1");
const donebtn = document.querySelector(".done-btn");
const chara = document.getElementById("chara");
const bin = document.getElementById("bin");
var flag = 0;
input1.value = 40;
chara.disabled = true;
bin.disabled = true;
donebtn.addEventListener("click", function(){
    if(flag == 0){
        show();
    }else{
        init();
    }

});
function init(){
  input1.style.background = "#F8F8F8";
  donebtn.innerHTML = "Done";
  flag = 0;
  input1.disabled = false;
  //input1.value = 40;
  chara.value = "";
  bin.value = "";
}
function show(){
    donebtn.disabled = true;
    donebtn.style.visibility = "hidden";
    input1.disabled = true;
    var t = input1.value;
    if(t.indexOf('.') !== -1 || isNaN(parseInt(t)) || parseInt(t) < 32 || parseInt(t) > 127) {
    input1.style.background = "red";
    donebtn.innerHTML = "Reset";
    flag = 1;
    donebtn.disabled = false;
    donebtn.style.visibility = "visible";
    }else{
    var code = parseInt(input1.value);
    if(code == 32){
        chara.value = "space";
    }else if(code == 127){
        chara.value = "DEL";
    }else{
        chara.value = String.fromCharCode(code);
    }
    //console.log(code,(code).toString(2) )
    bin.value = (code).toString(2);
    donebtn.innerHTML = "Reset";
    donebtn.disabled = false;
    donebtn.style.visibility = "visible";
    flag = 1;
    }
  
    
}
</script>
