<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="591px" height="281px" version="1.1"><defs/><g transform="translate(0.5,0.5)"><g transform="translate(19.5,46.5)"><switch><foreignObject style="overflow:visible;" pointer-events="all" width="550" height="187" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; vertical-align: top; width: 552px; white-space: nowrap; overflow-wrap: normal; text-align: center;"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;text-align:inherit;text-decoration:inherit;"><div align="left"><font style="font-size: 18px" face="Courier New"><span>n = 10 # n can be anything, this is just an example</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>sum = 0</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>pie = 3.14</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>for var in range(n,1,-3):</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>  print(pie)</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>  for j in range(n,0,-1):</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>    sum+=1</span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span><br /></span></font></div><div align="left"><font style="font-size: 18px" face="Courier New"><span>print(sum)</span></font></div></div></div></foreignObject><text x="275" y="100" fill="#000000" text-anchor="middle" font-size="12px" font-family="Helvetica">[Not supported by viewer]</text></switch></g></g></svg>